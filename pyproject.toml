[project]
name = "yasdl"
version = "0.0.1"
description = "Yet another schematic definition language: rectangular-block layouts for readable KiCad schematics"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
case-sensitive = false
order-by-type = false
combine-as-imports = true
known-third-party = ["docs", "yasdl"]
